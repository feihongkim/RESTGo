# restgo-listen — 실시간 신호 평가 컨테이너
#
# host network 사용 → localhost의 RabbitMQ / MSSQL(han)에 직접 접속.
# config.yaml, zpicture/ 디렉토리는 host에서 bind mount.
#
# 사용:
#   docker compose -f docker-compose.listen.yml build
#   docker compose -f docker-compose.listen.yml up -d
#   docker compose -f docker-compose.listen.yml logs -f
#   docker compose -f docker-compose.listen.yml down

services:
  listen:
    build:
      context: .
      dockerfile: Dockerfile.listen
    image: restgo-listen:latest
    container_name: restgo-listen
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./zpicture:/app/zpicture
    environment:
      - TZ=Asia/Seoul
      - RESTGO_DEGRADE_KIS2=true
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
